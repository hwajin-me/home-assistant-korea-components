check_medical_closed_day:
  name: 의료기관 휴무일 조회
  description: 확인된 날짜별 시간표로 하루 전체 휴무인지 조회합니다. 새 API 요청은 하지 않으며 알 수 없는 날짜는 unknown을 반환합니다. 전날부터 이어지는 영업이 있으면 완전 휴무가 아닙니다.
  fields:
    config_entry_id:
      name: 의료기관 설정 항목
      required: true
      selector:
        config_entry:
          integration: korea_incubator
    date:
      name: 조회 날짜
      required: true
      selector:
        date:
